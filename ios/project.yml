name: LifeRecorder
options:
  bundleIdPrefix: com.unayung
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WZFJ4E5LPD
targets:
  LifeRecorder:
    type: application
    platform: iOS
    sources: [LifeRecorder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unayung.liferecorder
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LifeRecorder/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [LifeRecorderTests]
  LifeRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeRecorderTests]
    dependencies:
      - target: LifeRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LifeRecorderMac:
    type: application
    platform: macOS
    sources:
      - LifeRecorderMac
      # The reading half of the phone app. Recording on a Mac stays with desktop/capture_mac.
      - path: LifeRecorder
        includes: [PinnedTransport.swift, Platform.swift, Reading.swift, Storage.swift, Vocabulary.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unayung.liferecorder.mac
        PRODUCT_NAME: Life Recorder
        PRODUCT_MODULE_NAME: LifeRecorderMac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LifeRecorderMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [LifeRecorderMacTests]
  LifeRecorderMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LifeRecorderMacTests]
    dependencies:
      - target: LifeRecorderMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app is named for people, not for its target, so the host cannot be derived.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Life Recorder.app/Contents/MacOS/Life Recorder
