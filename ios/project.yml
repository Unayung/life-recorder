name: LifeRecorder
options:
  bundleIdPrefix: com.unayung
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WZFJ4E5LPD
targets:
  LifeRecorder:
    type: application
    platform: iOS
    sources: [LifeRecorder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unayung.liferecorder
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LifeRecorder/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [LifeRecorderTests]
  LifeRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeRecorderTests]
    dependencies:
      - target: LifeRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
